services:
  - type: web
    name: smart-ability
    runtime: node
    region: singapore
    plan: free
    buildCommand: npm ci --prefix backend
    startCommand: npm run release --prefix backend && npm start --prefix backend
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: smart-ability-db
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: STORAGE_ACCESS_KEY
        generateValue: true
      # Creates the demo accounts behind the 1-Click Demo buttons, once, on an
      # empty database. Their passwords are public, so set this to "false"
      # before real families use the site.
      - key: SEED_DEMO_DATA
        value: "true"

databases:
  - name: smart-ability-db
    plan: free
    region: singapore
    postgresMajorVersion: "17"
